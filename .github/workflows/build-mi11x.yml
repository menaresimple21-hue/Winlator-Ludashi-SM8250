name: Build Mi 11X SD870 APK

on:
  workflow_dispatch:
  push:
    branches:
      - "Winlator-Ludashi-SM8250"

permissions:
  contents: read

concurrency:
  group: mi11x-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Gradle Maven Central mirror (avoid HTTP 429)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat <<'EOF' > "$HOME/.gradle/init.d/maven-mirror.gradle"
          def mirrorUrl = URI.create("https://maven-central.storage-download.googleapis.com/maven2/")

          def rewriteRepos = { RepositoryHandler repos ->
              repos.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url?.toString() ?: ""
                      if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                          repo.setUrl(mirrorUrl)
                      }
                  }
              }
          }

          gradle.settingsEvaluated { settings ->
              rewriteRepos(settings.pluginManagement.repositories)
              rewriteRepos(settings.dependencyResolutionManagement.repositories)
              def mirror = settings.pluginManagement.repositories.maven { url = mirrorUrl }
              settings.pluginManagement.repositories.remove(mirror)
              settings.pluginManagement.repositories.add(0, mirror)
          }

          gradle.beforeProject { project ->
              rewriteRepos(project.buildscript.repositories)
              def mirror = project.buildscript.repositories.maven { url = mirrorUrl }
              project.buildscript.repositories.remove(mirror)
              project.buildscript.repositories.add(0, mirror)
          }
          EOF

      - name: Configure PKCS12 signing keystore
        run: |
          set -euo pipefail
          sign_dir="${RUNNER_TEMP}/mi11x-signing"
          mkdir -p "$sign_dir"
          if [ -n "${{ secrets.LUDASHI_KEYSTORE_B64 }}" ] && [ -n "${{ secrets.LUDASHI_STORE_PASSWORD }}" ]; then
            printf '%s' "${{ secrets.LUDASHI_KEYSTORE_B64 }}" | base64 -d > "$sign_dir/mi11x.p12"
            signing_pass="${{ secrets.LUDASHI_STORE_PASSWORD }}"
          else
            signing_pass="mi11x-local-build-key"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$sign_dir/mi11x.p12" \
              -alias upstream -keyalg RSA -keysize 3072 -validity 10000 \
              -dname 'CN=Winlator Mi11X' -storepass "$signing_pass" -keypass "$signing_pass"
          fi
          echo "::add-mask::$signing_pass"
          {
            echo "LUDASHI_KEYSTORE_PATH=$sign_dir/mi11x.p12"
            echo "LUDASHI_STORE_PASSWORD=$signing_pass"
          } >> "$GITHUB_ENV"

      - name: Cache native shader tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ludashi-ci-tools
          key: native-tools-${{ runner.os }}-${{ hashFiles('.github/scripts/prepare-native-tools.sh') }}

      - name: Prepare native tools without apt
        run: bash .github/scripts/prepare-native-tools.sh

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify or build Ludashi Steam launcher
        run: bash .github/scripts/prepare-steam-launcher.sh

      - name: Download verified Gradle distribution with fallback
        run: bash .github/scripts/prepare-gradle.sh

      - name: Build signed release APK
        run: >-
          bash gradlew assembleRelease --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --stacktrace

      - name: Verify signed APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 5

      - name: Upload Mi 11X Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Mi11X-SD870-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
